<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Action attribute</title>
</head>
<body>
    <form action="/contact-me">
        <label for="email">UserName: </label>
        <input type="text" id="email" placeholder="Enter Name" required="true"><br>

        <label for="user_Password">Password: </label>
        <input id="user_Password" type="Password" placeholder="Enter Password"><br>
        <input type="submit"><br>
        Date: <input type="date"><br>
        Time: <input type="time"><br>
        File: <input type="file"><br>
        colr: <input type="color"><br>
        price Range: <input type="range"><br>
        button: <input type="button" value="check me"><br>
        Subbmit: <input type="submit"><br>
        <!--Rdio this is chose the option male, femal, other-->
        <label for="male">Male:</label>
        <input type="radio" id="male" name="gender" value="male"><br>

        <label for="female">Female:</label>
        <input type="radio" id="female" name="gender" value="female"><br>

        <label for="other">Other:</lebel>
        <input type="radio" id="other" name="gender" value="other"><br>
        

        <!--Checkbox-->
        <label for="apple">Apple:</label>
        <input type="checkbox" id="apple" name="fruit" value="apple"><br>

        <label for="C++ programming">C++:</label>
        <input type="checkbox" id="c++ programming" name="fruit" value="c++"><br>

        <label for="java">JAVA:</label>
        <input type="checkbox" id="java" name="java" value="java"><br>
    </form>
</body>
</html>
